runtime:
  execution: sequential
  # accuracy-first 安全上限，不是性能目标。
  total_timeout_seconds: 300
  output_dir: runtime_outputs

modules:
  # 正式结构：YOLO-World 只负责 8 类禁带品和行为辅助对象，不负责垃圾。
  - id: yolo_world_objects
    enabled: true
    type: detection
    task_group: object_detection
    backend: yolo_world
    model_path: ${WRC_YOLO_WORLD_MODEL_PATH}
    model_id: yolov8s-worldv2
    open_vocabulary_classes:
      - task_group: prohibited_items
        class_id: 0
        class_name: spray_can
        prompts: [spray can, aerosol can]
        visual_description: "带喷嘴或喷头的加压气雾罐。"
        distinguishing_rules: ["必须看见金属加压罐体和喷嘴/按压喷头；塑料饮料瓶、纸盒、食品容器和普通包装都不是 spray_can。"]
      - task_group: prohibited_items
        class_id: 1
        class_name: portable_gas_stove
        prompts: [portable gas stove, butane stove, camping stove]
        visual_description: "小型桌面炉具，可见燃烧器、锅架或气罐舱。"
        distinguishing_rules: ["不是带烤网的开放式 barbecue_grill。"]
      - task_group: prohibited_items
        class_id: 2
        class_name: megaphone
        prompts: [megaphone]
        visual_description: "手持锥形扩音器，可见前端喇叭口和握柄。"
        distinguishing_rules: ["不是箱体或网罩结构的 speaker。"]
      - task_group: prohibited_items
        class_id: 3
        class_name: skateboard
        prompts: [skateboard]
        visual_description: "平板式板面下方有轮子。"
        distinguishing_rules: ["没有直立转向杆或车把。"]
      - task_group: prohibited_items
        class_id: 4
        class_name: kick_scooter
        prompts: [children's scooter, kids scooter, kick scooter]
        visual_description: "站立踏板连接直立转向杆，顶部有车把。"
        distinguishing_rules: ["不是无车把的平板 skateboard。"]
      - task_group: prohibited_items
        class_id: 5
        class_name: speaker
        prompts: [speaker, portable speaker, bluetooth speaker]
        visual_description: "便携音箱或扩音设备，可见扬声器网罩、箱体或控制区域。"
        distinguishing_rules: ["不能仅凭电子设备外观判断。"]
      - task_group: prohibited_items
        class_id: 6
        class_name: roller_skates
        prompts: [roller skates]
        visual_description: "穿在脚上的带轮鞋。"
        distinguishing_rules: ["不是 skateboard 或 kick_scooter。"]
      - task_group: prohibited_items
        class_id: 7
        class_name: barbecue_grill
        prompts: [barbecue grill, charcoal grill]
        visual_description: "开放式烧烤炉体，可见烤网或炭火结构。"
        distinguishing_rules: ["不是小型桌面 portable_gas_stove。"]
      - task_group: uncivilized_behavior
        class_id: 0
        class_name: person
        prompts: [person, people, human, pedestrian]
        visual_description: "可见人体或主要身体轮廓。"
      - task_group: uncivilized_behavior
        class_id: 1
        class_name: bench
        prompts: [bench, park bench, public bench, seat]
        visual_description: "供人坐卧的长条座面，通常有支腿或靠背。"
      - task_group: uncivilized_behavior
        class_id: 2
        class_name: grass
        prompts: [grass, lawn, turf, green area]
        visual_description: "连续草叶覆盖的草坪或草地区域。"
        distinguishing_rules: ["不能只凭绿色区域判断。"]
      - task_group: uncivilized_behavior
        class_id: 3
        class_name: cigarette
        prompts: [cigarette, lit cigarette, cigarette smoke, smoking person, person smoking, smoker]
        visual_description: "细小柱状香烟，可见滤嘴或燃烧端。"
        distinguishing_rules: ["香烟盒不是单支 cigarette。"]
      - task_group: uncivilized_behavior
        class_id: 4
        class_name: vehicle
        prompts: [vehicle, car, truck, bus, parked vehicle]
        visual_description: "可载人或货物的车辆主体，可见车身和车轮。"
    device: auto
    confidence: 0.10
    iou: 0.70
    imgsz: 640

  # 垃圾固定使用独立 YOLO11m；类别顺序必须与 garbage_best.pt 完全一致。
  - id: garbage
    enabled: true
    type: detection
    task_group: garbage
    backend: ultralytics
    model_path: ${WRC_GARBAGE_MODEL_PATH}
    model_id: garbage_yolo11m
    expected_class_names:
      - crumpled_paper_ball
      - disposable_food_container
      - empty_cigarette_box
      - plastic_drink_bottle
      - plastic_food_wrapper
      - rigid_takeout_bag
    visual_class_guidance:
      crumpled_paper_ball:
        visual_description: "纸质材料形成的不规则团状或压皱结构，可见折皱、纸边或纸面。"
        distinguishing_rules: ["草地纹理、石头、衣物、身体部位、阴影、袋子、塑料物体和背景斑块都不是纸团；无法确认纸质时必须 uncertain 或 rejected。"]
      disposable_food_container:
        visual_description: "一次性餐盒、托盘或翻盖食品容器，可见塑料或纸质盒体结构。"
        distinguishing_rules: ["不能把没有明确盒体、托盘或翻盖结构的普通物体区域确认为 food container。"]
      empty_cigarette_box:
        visual_description: "矩形香烟包装盒，可见翻盖烟盒轮廓或其他明确烟盒结构。"
        distinguishing_rules: ["不能仅因为物体小且呈矩形就确认为 cigarette box。"]
      plastic_drink_bottle:
        visual_description: "塑料饮料瓶，可见瓶身、瓶颈、瓶盖或开口以及透明或半透明塑料外观。"
        distinguishing_rules: ["spray_can 和盒状包装不是 plastic drink bottle。"]
      plastic_food_wrapper:
        visual_description: "柔软、薄且可折叠的塑料食品包装或包装膜。"
        distinguishing_rules: ["硬盒、纸张、阴影和草地纹理不是 plastic food wrapper。"]
      rigid_takeout_bag:
        visual_description: "较硬挺、能保持袋形的外卖袋或手提包装结构。"
        distinguishing_rules: ["人物、衣服、大面积背景、墙体和任意大矩形区域都不是 rigid takeout bag。"]
    device: auto
    confidence: 0.25
    iou: 0.70
    imgsz: 640

behavior:
  enabled: true
  require_bbox: true
  module_id: behavior_pipeline
  task_group: uncivilized_behavior
  object_task_group: uncivilized_behavior
  classes:
    - class_id: 0
      class_name: trampling_grass
      required_object_classes: [person, grass]
      decision_rules:
        - "确认人的脚或身体支撑点实际位于草坪区域；仅在草坪旁不算违规。"
    - class_id: 1
      class_name: smoking
      required_object_classes: [person, cigarette]
      decision_rules:
        - "确认人物正在吸烟，可依据香烟、烟雾或明确吸烟姿态；仅出现香烟不算违规。"
    - class_id: 2
      class_name: blocking_fire_lane
      required_object_classes: [vehicle]
      decision_rules:
        - "确认车辆停放或占用有消防通道、禁停标识或明确通道语境的区域。"
    - class_id: 3
      class_name: standing_or_lying_on_bench
      required_object_classes: [person, bench]
      decision_rules:
        - "确认人物站在或躺在长椅上；正常坐在长椅上不算违规。"

review:
  low_confidence_threshold: 0.45
  cross_model_iou_threshold: 0.75
  review_cross_task_overlap: true
  review_module_failure: true
  require_finding_bbox: true
  reserve_seconds_for_fusion_and_output: 2.0
  candidate_selection:
    include_low_confidence: true
    include_cross_model_conflicts: true
    include_small_objects: true
    include_behavior_candidates: true
    review_all_task_groups: [garbage, prohibited_items]
    small_object_area_ratio: 0.01
  important_crops:
    enabled: true
    context_scale: 2.0
    min_crop_size_ratio: 0.12
    merge_iou_threshold: 0.20
    max_crops: 5
    # 接近全图的 crop 与 original_image 重复，不再发送。
    skip_crop_area_ratio: 0.90
  multi_image:
    enabled: true
    timeout_seconds: 180
    max_tokens: 1200
  provider:
    enabled: true
    type: qwen2_5_vl
    endpoint: http://127.0.0.1:8000/v1/chat/completions
    model_id: qwen-vl-32b
    api_key_env: null
    timeout_seconds: 180
    max_tokens: 1200
    temperature: 0
    image_max_side: 1024
    jpeg_quality: 90
    # 仅在 Thor 当前 vLLM 明确支持 OpenAI JSON response_format 时启用。
    response_format_json_object: true

fusion:
  finding_iou_threshold: 0.65
  uncertain_policy: keep_flagged
  review_failure_policy: keep_flagged

preview:
  enabled: true
  task_group_colors:
    prohibited_items: "#dc2626"
    garbage: "#16a34a"
    uncivilized_behavior: "#2563eb"
    unknown: "#d97706"
  status_colors:
    corrected: "#a855f7"
    uncertain: "#6b7280"
    review_failed: "#f97316"
    conflict: "#eab308"
